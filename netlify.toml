[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

# NOTE: NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY must be set
# in the Netlify dashboard (Site settings > Environment variables), NOT here.

# Catch-all rewrite for dynamic product detail pages on static export (P0-2 fix)
[[redirects]]
  from = "/products/*"
  to = "/products/creed-aventus.html"
  status = 200

# Telegram Webhook Endpoint
[[redirects]]
  from = "/api/telegram-webhook"
  to = "/.netlify/functions/telegram-webhook"
  status = 200
